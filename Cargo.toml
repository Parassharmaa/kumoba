[workspace]
resolver = "2"
members = ["crates/kumoba", "crates/kumoba-guest", "crates/kumoba-protocol", "crates/kumobad"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/Parassharmaa/kumoba"
homepage = "https://github.com/Parassharmaa/kumoba"
keywords = ["sandbox", "microvm", "libkrun", "agents", "isolation"]
categories = ["virtualization", "development-tools"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
base64 = "0.22"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = { version = "0.10", features = ["asm"] }
fs2 = "0.4"
libloading = "0.8"
tempfile = "3"
kumoba-protocol = { version = "0.1.0", path = "crates/kumoba-protocol" }
zeroize = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
webpki-roots = "1"
aho-corasick = "1"
