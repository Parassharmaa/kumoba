[workspace]
resolver = "2"
members = ["crates/kumoba", "crates/kumoba-guest", "crates/kumoba-protocol", "crates/kumobad"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/Parassharmaa/kumoba"
homepage = "https://github.com/Parassharmaa/kumoba"
keywords = ["sandbox", "microvm", "libkrun", "agents", "isolation"]
categories = ["virtualization", "development-tools"]

[workspace.dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
base64 = "0.22"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = { version = "0.10", features = ["asm"] }
fs2 = "0.4"
libloading = "0.8"
tempfile = "3"
kumoba-protocol = { version = "0.1.0", path = "crates/kumoba-protocol" }
zeroize = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
webpki-roots = "1.0.10"
aho-corasick = "1"
schemars = "1.2.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
uninlined_format_args = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
borrow_as_ptr = "warn"
match_wildcard_for_single_variants = "warn"
