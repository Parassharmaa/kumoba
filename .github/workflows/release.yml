name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  check:
    name: verify version, tests and registry dry runs
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: bash scripts/install-actionlint.sh
      - id: version
        run: echo "version=$(bash scripts/version.sh)" >> "$GITHUB_OUTPUT"
      - run: bash scripts/ci-release.sh "$TAG"

  assets:
    name: tarball (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        if: runner.os == 'Linux'
        with:
          path: |
            .local/libkrun-closefix
            .local/libkrunfw
            .local/downloads
          key: libkrun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('patches/**', 'scripts/build-libkrun-closefix.sh', 'scripts/prepare-linux-host.sh') }}
      - run: bash scripts/release-assets.sh "${{ needs.check.outputs.version }}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.os }}
          path: dist/kumoba-*.tar.zst
          if-no-files-found: error

  images:
    name: images (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            .local/libkrun-closefix
            .local/libkrunfw
            .local/downloads
          key: libkrun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('patches/**', 'scripts/build-libkrun-closefix.sh', 'scripts/prepare-linux-host.sh') }}
      - run: bash scripts/ci-free-disk.sh --android
      - run: bash scripts/release-images.sh "${{ needs.check.outputs.version }}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: images-${{ matrix.os }}
          path: dist/kumoba-image-*.raw.zst
          if-no-files-found: error
          compression-level: 0

  smoke:
    name: install and boot the release (linux x86_64, KVM)
    needs: [check, assets, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-ubuntu-24.04"
          path: dist
          merge-multiple: true
      - run: bash scripts/release-smoke.sh "${{ needs.check.outputs.version }}" dist

  publish-crates:
    name: publish to crates.io
    needs: [check, smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: pending
        run: echo "pending=$(bash scripts/crates-pending.sh)" >> "$GITHUB_OUTPUT"
      - id: auth
        if: steps.pending.outputs.pending == 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - if: steps.pending.outputs.pending == 'true'
        run: bash scripts/publish-crates.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-npm:
    name: publish to npm
    needs: publish-crates
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: bash scripts/publish-npm.sh

  release:
    name: GitHub release
    needs: [check, publish-npm]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: bash scripts/publish-release.sh "$TAG" dist
        env:
          GH_TOKEN: ${{ github.token }}
