name: walkthrough

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to install, e.g. 0.2.0
        required: true

permissions:
  contents: read

jobs:
  walkthrough:
    name: README walkthrough on a fresh runner (linux x86_64, KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bash scripts/ci-walkthrough.sh "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
