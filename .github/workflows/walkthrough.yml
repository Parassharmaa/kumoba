name: walkthrough

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to install, e.g. 0.2.0
        required: true

permissions:
  contents: read

jobs:
  walkthrough:
    name: README walkthrough on a fresh runner (linux x86_64, KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: bash scripts/ci-walkthrough.sh "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
