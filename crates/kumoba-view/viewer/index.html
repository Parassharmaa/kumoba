<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kumoba desktop</title>
<style>
  html, body { margin: 0; height: 100%; background: #101214; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; outline: none; cursor: default; }
  #keys { position: fixed; left: 0; top: 0; width: 1px; height: 1px; padding: 0; border: 0; margin: 0; resize: none; outline: none; opacity: 0; pointer-events: none; caret-color: transparent; overflow: hidden; white-space: nowrap; font: 14px/1.4 system-ui, sans-serif; }
  #keys.composing { width: auto; min-width: 12ch; height: auto; padding: 2px 6px; opacity: 1; color: #101214; background: #f2f4f6; border-radius: 4px; }
  #pointer { position: fixed; left: 0; top: 0; pointer-events: none; transform-origin: 0 0; }
  #status { position: fixed; left: 12px; bottom: 10px; font: 12px/1.4 system-ui, sans-serif; color: #c9d1d9; background: rgba(16, 18, 20, 0.8); padding: 4px 8px; border-radius: 4px; }
  #status:empty { display: none; }
</style>
</head>
<body>
<canvas id="screen" width="16" height="16"></canvas>
<textarea id="keys" aria-label="Keyboard input for the desktop" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" rows="1"></textarea>
<canvas id="pointer" width="1" height="1" hidden></canvas>
<div id="status" role="status">Connecting</div>
<script type="module" src="viewer.js"></script>
</body>
</html>
