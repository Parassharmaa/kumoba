[package]
name = "kumobad"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Daemon, CLI and VM worker for kumoba: fast sandboxes for AI agents"
readme = "README.md"

[[bin]]
name = "kumobad"
path = "src/main.rs"

[[bin]]
name = "kumoba"
path = "src/bin/kumoba.rs"
doc = false

[[bin]]
name = "kumoba-worker"
path = "src/bin/kumoba-worker.rs"
doc = false

[dependencies]
kumoba = { version = "0.6.5", path = "../kumoba" }
kumoba-protocol.workspace = true
tokio = { workspace = true, features = ["signal", "io-std"] }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tempfile.workspace = true
thiserror.workspace = true
libloading.workspace = true
libc.workspace = true
subtle = "2"
hmac = "0.13"
sha2.workspace = true
tokio-stream = "0.1"
tokio-util = "0.7"
url = "2"
schemars.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSGraphics"] }
objc2-virtualization = { version = "0.3.2", features = ["block2", "dispatch2"] }
block2 = "0.6"
dispatch2 = "0.3"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
